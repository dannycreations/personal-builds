name: 'Prepare Workspace'
description: 'Sets up Nagato, copies optional workspace files, and applies patches'
inputs:
  target-dir:
    description: 'The directory where the target repository is located'
    required: true
  copy-to:
    description: 'Subdirectory within target-dir to copy workspace files into'
    required: false
    default: ''
  nagato-version:
    description: 'Version of Nagato to use'
    required: false
    default: 'nightly'

runs:
  using: 'composite'
  steps:
    - name: Setup Nagato
      uses: dannycreations/nagato/.github/actions/setup-nagato@main
      with:
        version: ${{ inputs.nagato-version }}

    - name: Prepare Workspace
      shell: bash
      env:
        TARGET_DIR: ${{ inputs.target-dir }}
        COPY_TO: ${{ inputs.copy-to }}
      run: |
        set -euo pipefail

        mkdir -p "$TARGET_DIR"
        cd "$TARGET_DIR"

        DEST_DIR="${COPY_TO:-.}"
        PATCH_DIR="$GITHUB_WORKSPACE/patches/$TARGET_DIR"
        SCRIPTS_DIR="$GITHUB_WORKSPACE/scripts/$TARGET_DIR"

        copy_dir() {
          local source_dir="$1"
          local label="$2"

          if [[ ! -d "$source_dir" ]]; then
            echo "Source $label directory $source_dir does not exist. Skipping."
            return
          fi

          mkdir -p "$DEST_DIR"
          echo "Copying $label from $source_dir to $DEST_DIR"
          cp -rv "$source_dir/." "$DEST_DIR"
        }

        copy_dir "$PATCH_DIR" "patches"
        copy_dir "$SCRIPTS_DIR" "scripts"

        if [[ ! -d "$PATCH_DIR" ]]; then
          echo "Patch directory $PATCH_DIR not found, skipping."
          exit 0
        fi

        mapfile -t PATCHES < <(
          find "$PATCH_DIR" -type f -name '*.patch' -print | sort
        )

        if ((${#PATCHES[@]} == 0)); then
          echo "No .patch files found in $PATCH_DIR"
          exit 0
        fi

        echo "Applying ${#PATCHES[@]} patch(es) from $PATCH_DIR"

        for patch in "${PATCHES[@]}"; do
          nagato "$patch"
        done
