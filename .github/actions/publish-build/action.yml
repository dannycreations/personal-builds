name: 'Publish Build'
description: 'Generates a changelog, publishes the GitHub Release, and persists the new SHA'
inputs:
  old-sha:
    description: 'The last recorded SHA'
    required: false
  new-sha:
    description: 'The new head commit SHA'
    required: false
  target-dir:
    description: 'The directory where the target repository was checked out (for git log)'
    required: false
  release-title:
    description: 'The title of the release'
    required: true
  release-tag:
    description: 'The name of the release tag'
    required: true
  release-glob:
    description: 'Space-separated glob patterns to find release artifacts (e.g., "*.apk *.exe")'
    required: true
  prerelease:
    description: 'Whether this is a pre-release (true/false)'
    required: false
    default: false

runs:
  using: 'composite'
  steps:
    - name: Publish GitHub Release
      shell: bash
      env:
        OLD_SHA: ${{ inputs.old-sha }}
        NEW_SHA: ${{ inputs.new-sha }}
        TARGET_DIR: ${{ inputs.target-dir }}
        RELEASE_TITLE: ${{ inputs.release-title }}
        RELEASE_TAG: ${{ inputs.release-tag }}
        RELEASE_GLOB: ${{ inputs.release-glob }}
        PRERELEASE: ${{ inputs.prerelease }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        CHANGELOG_FILE="$GITHUB_WORKSPACE/changelog.txt"
        CHANGELOG=""

        if [[ -n "$NEW_SHA" ]]; then
          if [[ -n "$OLD_SHA" && -n "$TARGET_DIR" ]]; then
            CHANGELOG=$(
              git -C "$TARGET_DIR" log \
                --pretty=format:'- %s' \
                -n 10 \
                "$OLD_SHA..$NEW_SHA" 2>/dev/null || true
            )
          fi

          if [[ -z "$CHANGELOG" && -n "$TARGET_DIR" ]]; then
            CHANGELOG=$(
              git -C "$TARGET_DIR" log \
                --pretty=format:'- %s' \
                -n 10 \
                "$NEW_SHA" 2>/dev/null || true
            )
          fi
        fi

        printf '%s\n' "${CHANGELOG:-No changes detected in this build.}" \
          > "$CHANGELOG_FILE"

        read -ra GLOBS <<< "$RELEASE_GLOB"
        FILES=()

        for glob in "${GLOBS[@]}"; do
          while IFS= read -r -d '' file; do
            FILES+=("$file")
          done < <(
            if [[ "$glob" == */* ]]; then
              find "$GITHUB_WORKSPACE" \
                -type f \
                -path "*/$glob" \
                -print0
            else
              find "$GITHUB_WORKSPACE" \
                -type f \
                -name "$glob" \
                -print0
            fi
          )
        done

        if ((${#FILES[@]} == 0)); then
          echo "Error: No artifacts found matching pattern: $RELEASE_GLOB" >&2
          exit 1
        fi

        if gh release view "$RELEASE_TAG" &>/dev/null; then
          gh release delete "$RELEASE_TAG" -y --cleanup-tag
        fi

        TITLE="$RELEASE_TITLE"

        if [[ -n "$NEW_SHA" ]]; then
          TITLE="$TITLE (${NEW_SHA:0:7})"
        fi

        echo "Publishing release $RELEASE_TAG with title: $TITLE"

        RELEASE_ARGS=(
          release create "$RELEASE_TAG"
          --title "$TITLE"
          --notes-file "$CHANGELOG_FILE"
        )

        if [[ "$PRERELEASE" == "true" ]]; then
          RELEASE_ARGS+=(--prerelease)
        fi

        RELEASE_ARGS+=("${FILES[@]}")

        gh "${RELEASE_ARGS[@]}"

    - name: Update Cache Branch
      if: inputs.new-sha != '' && inputs.target-dir != ''
      shell: bash
      env:
        NEW_SHA: ${{ inputs.new-sha }}
        TARGET_DIR: ${{ inputs.target-dir }}
        RELEASE_TAG: ${{ inputs.release-tag }}
        GITHUB_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail

        CACHE_DIR=$(mktemp -d)
        SHA_FILE="${TARGET_DIR}.sha"
        SHORT_SHA="${NEW_SHA:0:7}"
        REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git"

        cleanup() {
          rm -rf "$CACHE_DIR"
        }

        trap cleanup EXIT

        git init -b cache "$CACHE_DIR"
        git -C "$CACHE_DIR" remote add origin "$REPO_URL"

        if git -C "$CACHE_DIR" fetch --depth=1 origin cache; then
          git -C "$CACHE_DIR" reset --hard FETCH_HEAD
        else
          echo "Cache branch not found, creating it."
        fi

        git -C "$CACHE_DIR" config user.name "github-actions[bot]"
        git -C "$CACHE_DIR" config user.email "github-actions[bot]@users.noreply.github.com"

        printf '%s' "$NEW_SHA" > "$CACHE_DIR/$SHA_FILE"
        git -C "$CACHE_DIR" add "$SHA_FILE"

        if ! git -C "$CACHE_DIR" diff --cached --quiet; then
          git -C "$CACHE_DIR" commit \
            -m "build($RELEASE_TAG): update sha to $SHORT_SHA"

          for attempt in {1..5}; do
            if git -C "$CACHE_DIR" push origin HEAD:cache; then
              echo "Successfully updated cache for $SHA_FILE"
              exit 0
            fi

            echo "Push failed, retrying ($attempt/5)..."

            if git -C "$CACHE_DIR" fetch --depth=1 origin cache; then
              git -C "$CACHE_DIR" reset --hard FETCH_HEAD
              git -C "$CACHE_DIR" add "$SHA_FILE"
              git -C "$CACHE_DIR" commit \
                -m "build($RELEASE_TAG): update sha to $SHORT_SHA" || true
            else
              echo "Cache branch disappeared while pushing, retrying..."
            fi

            sleep $((RANDOM % 5 + 1))
          done

          echo "Failed to push cache update after 5 attempts." >&2
          exit 1
        fi

        echo "No changes to commit for $SHA_FILE"
