name: PrismLauncher

on:
  schedule:
    - cron: '0 11 * * 6'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WORK_DIR: prismlauncher

jobs:
  build-and-release:
    name: Build and Release
    runs-on: windows-2022

    env:
      BUILD_TYPE: Release
      CMAKE_PRESET: windows_msvc
      ARTIFACT_NAME: Windows-MSVC-Qt6
      BUILD_PLATFORM: official

    defaults:
      run:
        working-directory: ${{ env.WORK_DIR }}

    steps:
      - name: Checkout Local Repository
        uses: actions/checkout@v6

      - name: Checkout Target Repository
        id: check-changes
        uses: ./.github/actions/check-changes
        with:
          target-repo: PrismLauncher/PrismLauncher
          target-branch: develop
          target-dir: ${{ env.WORK_DIR }}

      - name: Prepare Workspace
        if: steps.check-changes.outputs.has-changes == 'true'
        uses: ./.github/actions/prepare-workspace
        with:
          target-dir: ${{ env.WORK_DIR }}

      - name: Setup MSVC
        if: steps.check-changes.outputs.has-changes == 'true'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
          vsversion: 2022

      - name: Setup Java
        if: steps.check-changes.outputs.has-changes == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Qt
        if: steps.check-changes.outputs.has-changes == 'true'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          aqtversion: '==3.1.*'
          modules: qtimageformats qtnetworkauth
          cache: true

      - name: Setup vcpkg
        if: steps.check-changes.outputs.has-changes == 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FEED_URL: https://nuget.pkg.github.com/${{ env.WORK_DIR }}/index.json
        run: |
          .$(vcpkg fetch nuget) sources add `
            -Source "$env:FEED_URL" `
            -StorePasswordInClearText `
            -Name GitHubPackages `
            -UserName "$env:WORK_DIR" `
            -Password "$env:GITHUB_TOKEN"

          .$(vcpkg fetch nuget) setapikey "$env:GITHUB_TOKEN" `
            -Source "$env:FEED_URL"

          "VCPKG_BINARY_SOURCES=clear;nuget,$env:FEED_URL,readwrite" |
            Out-File -Append $env:GITHUB_ENV

          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" |
            Out-File -Append $env:GITHUB_ENV

      - name: Build and Package
        if: steps.check-changes.outputs.has-changes == 'true'
        shell: pwsh
        env:
          SHORT_SHA: ${{ steps.check-changes.outputs.short-sha }}
        run: |
          cmake --preset "$env:CMAKE_PRESET"
          cmake --build --preset "$env:CMAKE_PRESET" --config "$env:BUILD_TYPE"
          cmake --install build --config "$env:BUILD_TYPE"

          Copy-Item install install-portable -Recurse -Force

          cmake --install build `
            --config "$env:BUILD_TYPE" `
            --prefix install-portable `
            --component portable

          $zipName = "MSVC-$env:SHORT_SHA-$env:BUILD_TYPE.zip"
          Compress-Archive `
            -Path install-portable\* `
            -DestinationPath $zipName `
            -Force

      - name: Publish Build
        if: steps.check-changes.outputs.has-changes == 'true'
        uses: ./.github/actions/publish-build
        with:
          old-sha: ${{ steps.check-changes.outputs.old-sha }}
          new-sha: ${{ steps.check-changes.outputs.new-sha }}
          target-dir: ${{ env.WORK_DIR }}
          release-title: PrismLauncher Nightly
          release-tag: ${{ env.WORK_DIR }}
          release-glob: '${{ env.WORK_DIR }}/MSVC-*.zip'
